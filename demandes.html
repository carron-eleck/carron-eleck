<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carron Eleck - Demandes de devis</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           PAGE DEMANDES
        ===================================================== */

        .demandes-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .demandes-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .demandes-title h1 {
            margin-bottom: 8px;
        }

        .demandes-title p {
            margin: 0;
        }

        .back-dashboard {
            display: inline-block;
            text-decoration: none;
        }

        .demandes-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* =====================================================
           CARTE D'UNE DEMANDE
        ===================================================== */

        .demande-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .demande-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .demande-header h2 {
            margin: 0 0 6px;
        }

        .demande-date {
            color: #777;
            font-size: 14px;
        }

        .demande-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail-box {
            background: #f7f7f7;
            border-radius: 10px;
            padding: 14px;
        }

        .detail-box strong {
            display: block;
            margin-bottom: 5px;
        }

        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .demande-description {
            background: #f7f7f7;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .demande-description strong {
            display: block;
            margin-bottom: 8px;
        }

        /* =====================================================
           BOUTONS
        ===================================================== */

        .demande-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .demande-actions button {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-encours {
            background: #fff3cd;
            color: #856404;
        }

        .btn-accepter {
            background: #d4edda;
            color: #155724;
        }

        .btn-refuser {
            background: #f8d7da;
            color: #721c24;
        }

        /* =====================================================
           STATUT
        ===================================================== */

        .statut {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .statut-attente {
            background: #fff3cd;
            color: #856404;
        }

        .statut-encours {
            background: #cce5ff;
            color: #004085;
        }

        .statut-accepte {
            background: #d4edda;
            color: #155724;
        }

        .statut-refuse {
            background: #f8d7da;
            color: #721c24;
        }

        /* =====================================================
           AUCUNE DEMANDE
        ===================================================== */

        .aucune-demande {
            background: white;
            border-radius: 15px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .aucune-demande .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .aucune-demande h2 {
            margin: 0 0 10px;
            font-size: 22px;
            color: #222;
        }

        .aucune-demande p {
            margin: 0;
            color: #777;
            font-size: 15px;
        }

        /* =====================================================
           ERREUR
        ===================================================== */

        .erreur {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            .demandes-title {
                flex-direction: column;
                align-items: flex-start;
            }

            .demande-details {
                grid-template-columns: 1fr;
            }

            .demande-header {
                flex-direction: column;
            }
        }
    </style>
</head>


<body class="dashboard-body">

    <div class="dashboard">

        <!-- =====================================================
             HEADER
        ===================================================== -->

        <header>

            <a href="index.html" class="logo">

                <img
                    src="logo/logo.png"
                    alt="Carron Eleck"
                >

                <span>
                    Carron Eleck
                </span>

            </a>


            <nav>

                <a href="index.html">
                    Accueil
                </a>

                <a href="presentation.html">
                    Présentation
                </a>

                <a href="services.html">
                    Services
                </a>

                <a href="dashboard.html">
                    Tableau de bord
                </a>

            </nav>

        </header>


        <!-- =====================================================
             CONTENU
        ===================================================== -->

        <main class="demandes-container">


            <!-- =================================================
                 TITRE
            ================================================= -->

            <div class="demandes-title">

                <div>

                    <p class="dashboard-small-title">
                        ESPACE ADMIN
                    </p>

                    <h1>
                        Demandes de devis
                    </h1>

                    <p>
                        Retrouvez ici toutes les demandes envoyées par vos clients.
                    </p>

                </div>


                <a
                    href="dashboard.html"
                    class="dashboard-btn back-dashboard"
                >
                    ← Retour au tableau de bord
                </a>

            </div>


            <!-- =================================================
                 LISTE DES DEMANDES
            ================================================= -->

            <div
                id="listeDemandes"
                class="demandes-list"
            >

                <div class="aucune-demande">

                    <div class="empty-icon">
                        📋
                    </div>

                    <h2>
                        Chargement des demandes...
                    </h2>

                    <p>
                        Veuillez patienter.
                    </p>

                </div>

            </div>


        </main>

    </div>


    <!-- =====================================================
         SUPABASE
    ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <!-- =====================================================
         SCRIPT
    ===================================================== -->

    <script>

        // =====================================================
        // ÉCHAPPER LE HTML
        // =====================================================

        function echapperHTML(texte) {

            if (
                texte === null ||
                texte === undefined
            ) {
                return "";
            }

            return String(texte)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        // =====================================================
        // VÉRIFIER QUE L'UTILISATEUR EST ADMIN
        // =====================================================

        async function verifierAdmin() {

            const {
                data: { user },
                error
            } = await supabaseClient.auth.getUser();


            // Pas connecté

            if (
                error ||
                !user
            ) {

                window.location.href =
                    "connexion.html";

                return false;
            }


            // Récupération du profil

            const {
                data: profile,
                error: profileError
            } = await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .single();


            // Profil introuvable

            if (
                profileError ||
                !profile
            ) {

                window.location.href =
                    "connexion.html";

                return false;
            }


            // Pas admin

            if (
                profile.role !== "admin"
            ) {

                window.location.href =
                    "client.html";

                return false;
            }


            return true;
        }


        // =====================================================
        // CHARGER LES DEMANDES
        // =====================================================

        async function chargerDemandes() {

            const admin =
                await verifierAdmin();


            if (!admin) {
                return;
            }


            const container =
                document.getElementById(
                    "listeDemandes"
                );


            // =================================================
            // RÉCUPÉRATION DES DEMANDES
            // =================================================

            const {
                data: demandes,
                error
            } = await supabaseClient
                .from("devis")
                .select(`
                    id,
                    client_id,
                    titre,
                    service,
                    description,
                    montant,
                    statut,
                    created_at,
                    date_souhaitee,
                    horaire,
                    adresse,
                    nom,
                    prenom,
                    email,
                    telephone
                `)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            // =================================================
            // ERREUR
            // =================================================

            if (error) {

                console.error(
                    "Erreur Supabase :",
                    error
                );


                container.innerHTML = `

                    <div class="erreur">

                        Impossible de charger les demandes.

                        <br>
                        <br>

                        ${echapperHTML(error.message)}

                    </div>

                `;

                return;
            }


            // =================================================
            // AUCUNE DEMANDE
            // =================================================

            if (
                !demandes ||
                demandes.length === 0
            ) {

                container.innerHTML = `

                    <div class="aucune-demande">

                        <div class="empty-icon">
                            📋
                        </div>

                        <h2>
                            Aucune demande de devis
                        </h2>

                        <p>
                            Les demandes envoyées par vos clients
                            apparaîtront ici.
                        </p>

                    </div>

                `;

                return;
            }


            // =================================================
            // AFFICHAGE
            // =================================================

            container.innerHTML =
                demandes
                    .map(
                        demande =>
                            creerCarteDemande(
                                demande
                            )
                    )
                    .join("");
        }


        // =====================================================
        // CRÉER UNE CARTE DE DEMANDE
        // =====================================================

        function creerCarteDemande(
            demande
        ) {


            // =================================================
            // NOM DU CLIENT
            // =================================================

            const prenom =
                demande.prenom || "";

            const nom =
                demande.nom || "";


            let nomClient =
                `${prenom} ${nom}`.trim();


            if (!nomClient) {

                nomClient =
                    demande.email ||
                    "Client";
            }


            // =================================================
            // SERVICE
            // =================================================

            const service =
                demande.service ||
                demande.titre ||
                "Demande de devis";


            // =================================================
            // DATE DE CRÉATION
            // =================================================

            const dateCreation =
                demande.created_at
                    ? new Date(
                        demande.created_at
                    ).toLocaleDateString(
                        "fr-FR",
                        {
                            day: "2-digit",
                            month: "2-digit",
                            year: "numeric"
                        }
                    )
                    : "-";


            // =================================================
            // DATE SOUHAITÉE
            // =================================================

            let dateSouhaitee =
                "Non renseignée";


            if (
                demande.date_souhaitee
            ) {

                dateSouhaitee =
                    new Date(
                        demande.date_souhaitee
                    ).toLocaleDateString(
                        "fr-FR"
                    );
            }


            // =================================================
            // HORAIRE
            // =================================================

            const horaire =
                demande.horaire ||
                "Non renseigné";


            // =================================================
            // STATUT
            // =================================================

            const statut =
                demande.statut ||
                "En attente";


            let classeStatut =
                "statut-attente";


            if (
                statut === "En cours"
            ) {

                classeStatut =
                    "statut-encours";

            }
            else if (
                statut === "Accepté"
            ) {

                classeStatut =
                    "statut-accepte";

            }
            else if (
                statut === "Refusé"
            ) {

                classeStatut =
                    "statut-refuse";
            }


            // =================================================
            // MONTANT
            // =================================================

            const montant =
                demande.montant !== null &&
                demande.montant !== undefined
                    ? `${demande.montant} €`
                    : "Non renseigné";


            // =================================================
            // HTML DE LA CARTE
            // =================================================

            return `

                <div
                    class="demande-card"
                    data-id="${demande.id}"
                >


                    <!-- EN-TÊTE -->

                    <div class="demande-header">

                        <div>

                            <h2>
                                ${echapperHTML(service)}
                            </h2>

                            <div class="demande-date">

                                Demande reçue le

                                ${echapperHTML(
                                    dateCreation
                                )}

                            </div>

                        </div>


                        <span
                            id="statut-${demande.id}"
                            class="statut ${classeStatut}"
                        >

                            ${echapperHTML(
                                statut
                            )}

                        </span>

                    </div>


                    <!-- INFORMATIONS -->

                    <div class="demande-details">


                        <div class="detail-box">

                            <strong>
                                👤 Client
                            </strong>

                            ${echapperHTML(
                                nomClient
                            )}

                        </div>


                        <div class="detail-box">

                            <strong>
                                📧 E-mail
                            </strong>

                            ${echapperHTML(
                                demande.email ||
                                "Non renseigné"
                            )}

                        </div>


                        <div class="detail-box">

                            <strong>
                                📞 Téléphone
                            </strong>

                            ${echapperHTML(
                                demande.telephone ||
                                "Non renseigné"
                            )}

                        </div>


                        <div class="detail-box">

                            <strong>
                                📍 Adresse
                            </strong>

                            ${echapperHTML(
                                demande.adresse ||
                                "Non renseignée"
                            )}

                        </div>


                        <div class="detail-box">

                            <strong>
                                📅 Date souhaitée
                            </strong>

                            ${echapperHTML(
                                dateSouhaitee
                            )}

                        </div>


                        <div class="detail-box">

                            <strong>
                                🕐 Horaire
                            </strong>

                            ${echapperHTML(
                                horaire
                            )}

                        </div>


                        <div class="detail-box">

                            <strong>
                                💶 Montant
                            </strong>

                            ${echapperHTML(
                                montant
                            )}

                        </div>


                    </div>


                    <!-- DESCRIPTION -->

                    <div class="demande-description">

                        <strong>
                            📝 Description
                        </strong>

                        ${
                            demande.description
                                ? echapperHTML(
                                    demande.description
                                )
                                : "Aucune description fournie."
                        }

                    </div>


                    <!-- ACTIONS -->

                    <div class="demande-actions">


                        <button
                            class="btn-encours"
                            onclick="changerStatut(${demande.id}, 'En cours')"
                        >

                            🔧 Mettre en cours

                        </button>


                        <button
                            class="btn-accepter"
                            onclick="changerStatut(${demande.id}, 'Accepté')"
                        >

                            ✅ Accepter

                        </button>


                        <button
                            class="btn-refuser"
                            onclick="changerStatut(${demande.id}, 'Refusé')"
                        >

                            ❌ Refuser

                        </button>


                    </div>


                </div>

            `;
        }


        // =====================================================
        // CHANGER LE STATUT
        // =====================================================

        async function changerStatut(
            id,
            nouveauStatut
        ) {


            const confirmation =
                confirm(
                    `Voulez-vous mettre cette demande en "${nouveauStatut}" ?`
                );


            if (!confirmation) {
                return;
            }


            // Modification dans Supabase

            const {
                error
            } = await supabaseClient
                .from("devis")
                .update({
                    statut: nouveauStatut
                })
                .eq(
                    "id",
                    id
                );


            // =================================================
            // ERREUR
            // =================================================

            if (error) {

                console.error(
                    "Erreur modification statut :",
                    error
                );


                alert(
                    "Impossible de modifier le statut."
                );

                return;
            }


            // =================================================
            // ACTUALISER LE BADGE
            // =================================================

            const badge =
                document.getElementById(
                    `statut-${id}`
                );


            if (badge) {

                badge.textContent =
                    nouveauStatut;


                badge.className =
                    "statut";


                if (
                    nouveauStatut === "En cours"
                ) {

                    badge.classList.add(
                        "statut-encours"
                    );

                }
                else if (
                    nouveauStatut === "Accepté"
                ) {

                    badge.classList.add(
                        "statut-accepte"
                    );

                }
                else if (
                    nouveauStatut === "Refusé"
                ) {

                    badge.classList.add(
                        "statut-refuse"
                    );

                }
                else {

                    badge.classList.add(
                        "statut-attente"
                    );
                }
            }


            alert(
                "Statut mis à jour avec succès."
            );
        }


        // =====================================================
        // LANCEMENT
        // =====================================================

        chargerDemandes();

    </script>

</body>

</html>
